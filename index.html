<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a0208">
  <title>Mistrielle Nails | Estamos haciendo unas mejoras</title>
  <style>
    :root{
      --night:#120207;--wine:#3b0715;--wine2:#651128;--wine3:#821b31;
      --pink:#f2b7aa;--pink-soft:#f6d8d3;--gold:#c8a267;--gold2:#ecd09b;
      --text:#f8e6e2;--muted:#d8b6b7;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{
      min-height:100vh;display:grid;place-items:center;padding:22px;overflow-x:hidden;
      color:var(--text);font-family:Arial,Helvetica,sans-serif;
      background:
        radial-gradient(circle at 50% 8%,rgba(130,27,49,.52),transparent 31%),
        radial-gradient(circle at 10% 90%,rgba(101,17,40,.25),transparent 26%),
        linear-gradient(160deg,#0f0105 0%,#320713 50%,#120106 100%);
    }
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;
      background-image:radial-gradient(rgba(236,208,155,.34) .6px,transparent .6px);
      background-size:24px 24px;
    }
    .page{position:relative;z-index:1;width:min(700px,100%)}
    .card{
      position:relative;overflow:hidden;width:100%;padding:54px 36px 44px;text-align:center;
      border:1px solid rgba(236,208,155,.55);border-radius:24px;
      background:
        radial-gradient(circle at 82% 0%,rgba(130,27,49,.18),transparent 30%),
        linear-gradient(145deg,rgba(59,7,21,.97),rgba(23,2,9,.99));
      box-shadow:0 30px 90px rgba(0,0,0,.56);
    }
    .card::before{
      content:"";position:absolute;inset:12px;pointer-events:none;
      border:1px solid rgba(236,208,155,.12);border-radius:17px;
    }
    .eyebrow{position:relative;color:var(--gold2);font-size:11px;font-weight:800;letter-spacing:.30em}
    .subbrand{position:relative;margin-top:8px;color:#b98c92;font-size:9px;letter-spacing:.18em}
    .divider{
      position:relative;width:48px;height:1px;margin:24px auto 30px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent);
    }
    h1{
      position:relative;max-width:580px;margin:0 auto 20px;color:var(--pink);
      font-family:Georgia,"Times New Roman",serif;font-size:clamp(36px,7vw,56px);
      font-style:italic;font-weight:400;line-height:1.08;
    }
    .intro{
      position:relative;max-width:510px;margin:0 auto 14px;color:var(--pink-soft);
      font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.7;
    }
    .orders{
      position:relative;max-width:530px;margin:0 auto;color:var(--muted);
      font-size:14px;line-height:1.75;
    }
    .button-wrap{position:relative;margin-top:30px}
    .whatsapp{
      display:inline-flex;align-items:center;justify-content:center;min-height:50px;
      padding:14px 26px;border:1px solid #f4dca7;border-radius:999px;color:#28060d;
      background:linear-gradient(135deg,#efd697,#bb8844);
      box-shadow:0 12px 30px rgba(0,0,0,.31);text-decoration:none;
      font-size:11px;font-weight:900;letter-spacing:.09em;
      transition:transform .2s ease,filter .2s ease,box-shadow .2s ease;
    }
    .whatsapp:hover{
      transform:translateY(-2px);filter:brightness(1.08);
      box-shadow:0 16px 36px rgba(0,0,0,.38);
    }
    .note{
      position:relative;display:block;margin-top:18px;color:#aa8187;
      font-size:10px;letter-spacing:.08em;
    }
    .heart{color:var(--pink)}
    @media(max-width:520px){
      body{padding:14px}
      .card{padding:43px 21px 37px;border-radius:20px}
      .card::before{inset:9px}
      .intro{font-size:15px}
      .orders{font-size:13px}
      .whatsapp{width:100%;padding:15px 18px}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="eyebrow">MISTRIELLE NAILS</div>
      <div class="subbrand">PRESS-ON NAILS · HECHAS PARA TI</div>
      <div class="divider"></div>
      <h1>Estamos haciendo unas mejoras <span class="heart">♡</span></h1>
      <p class="intro">Nuestra tienda online estará disponible nuevamente muy pronto.</p>
      <p class="orders">
        Mientras volvemos, puedes seguir pidiendo tus sets y personalizados
        directamente por WhatsApp.
      </p>
      <div class="button-wrap">
        <a
          class="whatsapp"
          href="https://wa.me/529171380331?text=Hola%20Mistrielle%20Nails%20%E2%99%A1%20Quiero%20hacer%20un%20pedido."
          target="_blank"
          rel="noopener noreferrer"
        >CONTACTAR POR WHATSAPP</a>
      </div>
      <small class="note">Seguimos tomando pedidos <span class="heart">♡</span></small>
    </section>
  </main>
</body>
</html>
