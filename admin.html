function optArray(k){return k==='categories'?categories:k==='sizes'?sizes:k==='forms'?forms:k==='lengths'?lengths:null}
function editor(title,a,key){return `<div class="box"><div class="row"><h2 class="script">${title}</h2><button class="btn sm" onclick="addOpt('${key}')">+ Agregar</button></div><div class="chips">${a.map((x,i)=>`<span class="chip">${esc(x)} <button title="Editar" onclick="editOpt('${key}',${i})" style="border:0;background:none;color:var(--gold2);font-weight:800">✎</button><button title="Eliminar" onclick="removeOpt('${key}',${i})" style="border:0;background:none;color:#d87588;font-weight:800">×</button></span>`).join('')}</div></div>`}
function addOpt(k){let a=optArray(k),v=prompt('Nueva opción:');if(!a||!v||!v.trim())return;v=v.trim();if(a.some(x=>x.toLowerCase()===v.toLowerCase()))return alert('Esa opción ya existe.');a.push(v);save(k,a);renderAdmin()}
function editOpt(k,i){
 let a=optArray(k);if(!a||!a[i])return;let old=a[i],v=prompt('Editar opción:',old);if(v===null||!v.trim())return;v=v.trim();
 if(a.some((x,n)=>n!==i&&x.toLowerCase()===v.toLowerCase()))return alert('Esa opción ya existe.');
 a[i]=v;
 if(k==='categories')products.forEach(p=>{if(p.category===old)p.category=v});
 if(k==='sizes')products.forEach(p=>{if(p.stock&&Object.prototype.hasOwnProperty.call(p.stock,old)){p.stock[v]=Number(p.stock[v]||0)+Number(p.stock[old]||0);delete p.stock[old]}if(Array.isArray(p.sizes))p.sizes=p.sizes.map(x=>x===old?v:x)});
 if(k==='forms')products.forEach(p=>{if(Array.isArray(p.forms))p.forms=p.forms.map(x=>x===old?v:x)});
 if(k==='lengths')products.forEach(p=>{if(Array.isArray(p.lengths))p.lengths=p.lengths.map(x=>x===old?v:x)});
 save(k,a);save('products',products);renderAdmin();
}
function removeOpt(k,i){
 let a=optArray(k);if(!a||!a[i])return;let old=a[i];
 if(!confirm(`¿Eliminar "${old}"? También se quitará de los productos que la usen.`))return;
 a.splice(i,1);
 if(k==='categories')products.forEach(p=>{if(p.category===old)p.category=''});
 if(k==='sizes')products.forEach(p=>{if(p.stock)delete p.stock[old];if(Array.isArray(p.sizes))p.sizes=p.sizes.filter(x=>x!==old)});
 if(k==='forms')products.forEach(p=>{if(Array.isArray(p.forms))p.forms=p.forms.filter(x=>x!==old)});
 if(k==='lengths')products.forEach(p=>{if(Array.isArray(p.lengths))p.lengths=p.lengths.filter(x=>x!==old)});

async function mnValidateRequestCoupon(code,subtotal){
 const clean=String(code||'').trim().toUpperCase().replace(/\s+/g,'');
 if(!clean)return {code:'',amount:0,total:Number(subtotal||0),discount:null};
 const [{data:dr,error:de},{data:or,error:oe}]=await Promise.all([
  mnCloud.from('mn_discounts_cloud').select('code,payload').eq('code',clean),
  mnCloud.from('mn_orders_cloud').select('order_number,payload')
 ]);
 if(de)throw de;if(oe)throw oe;
 const row=(dr||[])[0];
 if(!row)throw new Error(`El cupón ${clean} no existe.`);
 const d={...((row.payload&&typeof row.payload==='object')?row.payload:{}),code:row.code||clean};
 if(!d.active)throw new Error(`El cupón ${clean} está inactivo.`);
 if(d.expires&&new Date(d.expires+'T23:59:59')<new Date())throw new Error(`El cupón ${clean} ya venció.`);
 const reserved=(or||[]).map(x=>(x.payload&&typeof x.payload==='object')?x.payload:{}).filter(o=>String(o.discountCode||'').toUpperCase()===clean&&o.discountState==='Reservado'&&o.status!=='Cancelado').length;
 const occupied=Number(d.used||0)+reserved;
 if(Number(d.maxUses||0)>0&&occupied>=Number(d.maxUses))throw new Error(`El cupón ${clean} ya alcanzó su límite de usos.`);
 const base=Number(subtotal||0);
 const amount=Math.max(0,Math.min(base,d.type==='percent'?base*(Number(d.value||0)/100):Number(d.value||0)));
 return {code:clean,amount,total:Math.max(0,base-amount),discount:d};
}
async function saveRequestAdmin(i){
 let r=requests[i],newStatus=$('rstatus_'+i).value,price=Number($('rprice_'+i).value||0);
 if(newStatus==='Aceptada'&&price<=0)return alert('Antes de aceptar la solicitud, añade el precio acordado o cotizado.');
 r.status=newStatus;r.reply=$('reply_'+i).value.trim();r.quotedPrice=price;
 try{
  if(newStatus==='Aceptada'&&!r.convertedOrder){
   let promo={code:'',amount:0,total:price,discount:null};
   if(r.discountCodeRequested)promo=await mnValidateRequestCoupon(r.discountCodeRequested,price);

   r.discountAmount=promo.amount;r.finalPrice=promo.total;
   if(promo.discount){r.discountType=promo.discount.type;r.discountValue=Number(promo.discount.value||0);}

   const {data:num,error}=await mnCloud.rpc('mn_create_order',{order_data:o});

  }else if(r.convertedOrder&&price>0){

    let amount=0;
    if(o.discountCode){
     const type=o.discountType||r.discountType,value=Number(o.discountValue??r.discountValue??0);

    o.subtotal=price;o.discountAmount=amount;o.total=total;
    if(o.items?.length===1&&o.items[0].id==='PERSONALIZADO')o.items[0].price=price;
    r.discountAmount=amount;r.finalPrice=total;save('orders',orders);
   }
  }else{
   r.finalPrice=price;
  }

  save('requests',requests);
  alert(newStatus==='Aceptada'
   ?`Solicitud aceptada por ${money(price)}${r.discountCodeRequested&&Number(r.discountAmount||0)>0?` − ${money(r.discountAmount)} de cupón = ${money(r.finalPrice)}`:''} y vinculada al pedido ${r.convertedOrder}.`
   :'Estado, precio y mensaje guardados.');
  renderAdmin();
 }catch(e){
  console.error('Aceptar solicitud personalizada:',e);
  alert('No se pudo aceptar la solicitud: '+(e.message||e));
  try{await mnRefreshAdminCloud();}catch(_){}
 }
}

async function deleteOrder(i){
 const o=orders[i];if(!o)return;
 if(!confirm(`¿Eliminar DEFINITIVAMENTE ${o.number}?\n\nSi este pedido afectó stock, descuento o ventas, el Admin intentará revertirlo antes de borrarlo.`))return;
 try{
  document.getElementById('mnCloudBadge').textContent='Nube: eliminando pedido…';

  // Si el pedido llegó a descontar stock, lo devuelve antes de eliminarlo.
  if(o.stockApplied){
   const {data,error}=await mnCloud.from('products').select('*').order('created_at',{ascending:false});
   if(error)throw error;
   products=(data||[]).map(mnFromDb);
   for(const it of (o.items||[])){
    const p=products.find(x=>x.id===it.id);
    if(!p||p.madeToOrder||it.size==='Personalizada'||it.id==='PERSONALIZADO')continue;
    p.stock=p.stock||{};
    p.stock[it.size]=Number(p.stock[it.size]||0)+Number(it.qty||1);
    if(p.status==='Agotado')p.status='Disponible';
   }
   const rows=products.map(mnToDb);
   if(rows.length){const {error:pe}=await mnCloud.from('products').upsert(rows,{onConflict:'id'});if(pe)throw pe;}
   mnOriginalSetItem('mn_products',JSON.stringify(products));
  }

  // Si consumió un cupón, devuelve ese uso.
  if(o.discountCode&&o.discountState==='Usado'){
   discounts=load('discounts',discounts);
   const d=discounts.find(x=>String(x.code||'').toUpperCase()===String(o.discountCode||'').toUpperCase());
   if(d){d.used=Math.max(0,Number(d.used||0)-1);save('discounts',discounts);}
  }

  // Quita cualquier movimiento automático/manual vinculado exactamente al PED.
  sales=load('sales',sales).filter(x=>String(x.order||'').toUpperCase()!==String(o.number||'').toUpperCase());
  save('sales',sales);

  // Borra la fila real de Supabase. Ya no reaparecerá al recargar.
  const {error}=await mnCloud.from('mn_orders_cloud').delete().eq('order_number',o.number);
  if(error)throw error;

  orders=orders.filter(x=>x.number!==o.number);
  mnOriginalSetItem('mn_orders',JSON.stringify(orders));
  document.getElementById('mnCloudBadge').textContent='Nube: pedido eliminado ✓';
  renderAdmin();
 }catch(e){
  console.error('Eliminar pedido:',e);
  document.getElementById('mnCloudBadge').textContent='Nube: error';
  alert('No se pudo eliminar el pedido. No se completó la limpieza: '+(e.message||e));
  try{await mnRefreshAdminCloud();}catch(_){}
 }
}

async function orderStatus(i,v){
 let o=orders[i],prev=o.status;
 // Primero actualizamos inventario usando la versión MÁS RECIENTE de Supabase.
 try{
   if(v==='Confirmado'&&!o.stockApplied){
     const {data,error}=await mnCloud.from('products').select('*').order('created_at',{ascending:false});
     if(error)throw error;
     products=(data||[]).map(mnFromDb);

     for(const it of (o.items||[])){
       const p=products.find(x=>x.id===it.id);
       if(!p || p.madeToOrder || it.size==='Personalizada' || it.id==='PERSONALIZADO')continue;
       p.stock=p.stock||{};
       const available=Number(p.stock[it.size]||0);
       const qty=Number(it.qty||1);
       if(qty>available)throw new Error(`No hay stock suficiente de ${p.name} talla ${it.size}. Disponible: ${available}.`);
       p.stock[it.size]=available-qty;
       if(sizes.every(s=>Number(p.stock[s]||0)<=0))p.status='Agotado';
     }

     const rows=products.map(mnToDb);
     if(rows.length){
       const {error:pe}=await mnCloud.from('products').upsert(rows,{onConflict:'id'});
       if(pe)throw pe;
     }
     o.stockApplied=true;
     o.stockAppliedAt=Date.now();
     mnOriginalSetItem('mn_products',JSON.stringify(products));
   }

   if(v==='Cancelado'&&o.stockApplied&&prev!=='Cancelado'){
     const {data,error}=await mnCloud.from('products').select('*').order('created_at',{ascending:false});
     if(error)throw error;
     products=(data||[]).map(mnFromDb);

     for(const it of (o.items||[])){
       const p=products.find(x=>x.id===it.id);
       if(!p || p.madeToOrder || it.size==='Personalizada' || it.id==='PERSONALIZADO')continue;
       p.stock=p.stock||{};
       p.stock[it.size]=Number(p.stock[it.size]||0)+Number(it.qty||1);
       if(p.status==='Agotado')p.status='Disponible';
     }

     const rows=products.map(mnToDb);
     if(rows.length){
       const {error:pe}=await mnCloud.from('products').upsert(rows,{onConflict:'id'});
       if(pe)throw pe;
     }
     o.stockApplied=false;
     o.stockAppliedAt=null;
     mnOriginalSetItem('mn_products',JSON.stringify(products));
   }
 }catch(e){
   console.error('Inventario Mistrielle:',e);
   alert('No se cambió el estado porque el inventario no pudo actualizarse: '+(e.message||e));
   renderAdmin();
   return;
 }

 o.status=v;
 discounts=load('discounts',discounts);

 // Confirmar cupón al confirmar pedido/pago.
 if(v==='Confirmado'&&o.discountCode&&o.discountState!=='Usado'){
   let d=discounts.find(x=>x.code===o.discountCode);
   if(d){d.used=Number(d.used||0)+1;save('discounts',discounts)}
   o.discountState='Usado';o.discountConfirmedAt=Date.now();
 }
 // Al cancelar un pedido ya confirmado, devolver el uso del cupón.
 if(v==='Cancelado'&&o.discountCode&&o.discountState==='Usado'&&prev!=='Cancelado'){
   let d=discounts.find(x=>x.code===o.discountCode);
   if(d){d.used=Math.max(0,Number(d.used||0)-1);save('discounts',discounts)}
   o.discountState='Liberado';o.discountConfirmedAt=null;
 }
 if(v==='Cancelado'&&o.discountCode&&o.discountState==='Reservado')o.discountState='Liberado';

 if(v==='Entregado'&&!o.saleRecorded){
   sales.unshift({date:new Date().toISOString().slice(0,10),order:o.number,concept:'Venta '+o.number,revenue:Number(o.total||0),cost:0,notes:'Registro creado al marcar el pedido como entregado.'});
   o.saleRecorded=true;save('sales',sales);
 }

 save('orders',orders);
 renderAdmin();
}

function faqMediaList(f){
 const arr=Array.isArray(f?.mediaItems)?f.mediaItems.filter(x=>x?.url):((f?.media)?[{url:f.media,type:f.mediaType||'image'}]:[]);
 return arr;
}
function faqMediaAdminPreview(f,i){
 const arr=faqMediaList(f);
 if(!arr.length)return '<div class="notice" style="margin-top:10px">No hay imágenes o videos guardados todavía.</div>';
 return `<div style="margin-top:12px"><div class="eyebrow">MATERIAL ACTUAL · ${arr.length}</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">${arr.map((m,j)=>`<div style="width:118px"><div style="height:100px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#16030a;display:grid;place-items:center">${m.type==='video'?`<video src="${m.url}" style="width:100%;height:100%;object-fit:cover" muted></video>`:`<img src="${m.url}" alt="" style="width:100%;height:100%;object-fit:cover">`}</div><button type="button" class="btn danger sm" style="width:100%;margin-top:5px" onclick="removeFaqMediaItem(${i},${j})">Quitar</button></div>`).join('')}</div></div>`;

function previewFaqSelected(input){

  box.appendChild(el);
 });
}
async function saveFaq(i){
 let q=$('fq').value.trim(),a=$('fa').value.trim();
 if(!q||!a)return alert('Completa pregunta y respuesta.');
 let old=i>=0?faqs[i]:{},existing=faqMediaList(old),files=[...($('fmedia')?.files||[])];
 try{
  let added=[];
  if(files.length){
   added=await Promise.all(files.map(async file=>({url:await mnUploadImage(file,'faq'),type:file.type.startsWith('video/')?'video':'image'})));
  }
  let f={...old,q,a,mediaItems:[...existing,...added]};
  f.media=f.mediaItems[0]?.url||'';
  f.mediaType=f.mediaItems[0]?.type||'';
  if(i<0)faqs.push(f);else faqs[i]=f;
  save('faqs',faqs);closeModal();renderAdmin();
 }catch(e){console.error(e);alert('No se pudo subir uno de los materiales de FAQ a Storage.')}
}
function removeFaqMediaItem(i,j){
 const arr=faqMediaList(faqs[i]);arr.splice(j,1);
 faqs[i].mediaItems=arr;
 faqs[i].media=arr[0]?.url||'';
 faqs[i].mediaType=arr[0]?.type||'';
 save('faqs',faqs);
 faqForm(i);
}

<style>
#mnAuthGate{position:fixed;inset:0;z-index:99999;background:#17050b;display:flex;align-items:center;justify-content:center;padding:24px;font-family:inherit}.mn-login{width:min(430px,100%);background:#fff7f7;border:1px solid #c5a05a;padding:28px;border-radius:18px;box-shadow:0 25px 80px #0008;color:#3b0715}.mn-login h2{margin:0 0 8px;font-size:30px}.mn-login p{color:#735c64}.mn-login input{width:100%;box-sizing:border-box;margin:7px 0 12px;padding:12px;border:1px solid #d8c7cb;border-radius:10px}.mn-login button{width:100%;padding:12px;border:0;border-radius:10px;background:#3b0715;color:white;font-weight:700;cursor:pointer}#mnAuthError{color:#a11635;min-height:20px;font-size:13px;margin-top:10px}.mn-cloud-badge{position:fixed;right:12px;bottom:12px;z-index:9998;background:#17050b;color:#f4cfd9;border:1px solid #c5a05a;padding:7px 10px;border-radius:999px;font-size:11px}
</style>
<div id="mnAuthGate"><div class="mn-login"><div style="letter-spacing:.18em;font-size:11px">MISTRIELLE NAILS</div><h2>Administración</h2><p>Inicia sesión con tu cuenta administradora.</p><label>Correo</label><input id="mnLoginEmail" type="email" autocomplete="username"><label>Contraseña</label><input id="mnLoginPassword" type="password" autocomplete="current-password"><button id="mnLoginBtn">Entrar</button><div id="mnAuthError"></div></div></div><div class="mn-cloud-badge" id="mnCloudBadge">Nube: conectando…</div>
<script>
const mnCloud = window.supabase.createClient(window.MN_SUPABASE_URL, window.MN_SUPABASE_KEY);
const MN_IMAGE_BUCKET='mistrielle-images';
function mnSafeName(name){return String(name||'archivo').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'-').replace(/-+/g,'-').toLowerCase()}
async function mnUploadImage(file,folder='general'){
 if(!file)return null;
 const ext=(file.name.split('.').pop()||'bin').toLowerCase();
 const base=mnSafeName(file.name.replace(/\.[^.]+$/,'')).slice(0,55)||'archivo';
 const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${base}.${ext}`;
 const {error}=await mnCloud.storage.from(MN_IMAGE_BUCKET).upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});
 if(error)throw error;
 return mnCloud.storage.from(MN_IMAGE_BUCKET).getPublicUrl(path).data.publicUrl;
}

function mnFromDb(p){return {id:p.id,name:p.name||'',description:p.description||'',keywords:p.keywords||'',price:Number(p.price||0),salePrice:p.promo_price==null?null:Number(p.promo_price),category:Array.isArray(p.categories)?(p.categories[0]||''):((p.categories&&p.categories.category)||''),images:Array.isArray(p.images)?p.images:[],forms:Array.isArray(p.forms)?p.forms:[],lengths:Array.isArray(p.lengths)?p.lengths:[],stock:(p.stock&&typeof p.stock==='object')?p.stock:{},madeToOrder:!!p.made_to_order,status:p.status||'Disponible',created:p.created_at?new Date(p.created_at).getTime():Date.now()};}
function mnToDb(p){return {id:p.id,name:p.name||'',description:p.description||'',keywords:p.keywords||'',price:Number(p.price||0),promo_price:p.salePrice==null?null:Number(p.salePrice),categories:[p.category||''],images:Array.isArray(p.images)?p.images:[],forms:Array.isArray(p.forms)?p.forms:[],lengths:Array.isArray(p.lengths)?p.lengths:[],stock:p.stock||{},made_to_order:!!p.madeToOrder,status:p.status||'Disponible',visible:p.status!=='Oculto'};}
async function mnCheckAdmin(){const {data,error}=await mnCloud.rpc('is_admin');if(error||data!==true)throw new Error('Esta cuenta no tiene permisos de administradora.');}
async function mnLoadCloudProducts(){const {data,error}=await mnCloud.from('products').select('*').order('created_at',{ascending:false});if(error)throw error;products=(data||[]).map(mnFromDb);localStorage.setItem('mn_products',JSON.stringify(products));renderAdmin();}
async function mnSyncProducts(){
 try{
  document.getElementById('mnCloudBadge').textContent='Nube: guardando…';
  const rows=products.map(mnToDb);
  if(rows.length){const {error}=await mnCloud.from('products').upsert(rows,{onConflict:'id'});if(error)throw error;}
  const {data:remote,error:re}=await mnCloud.from('products').select('id');if(re)throw re;
  const keep=new Set(products.map(p=>p.id));const gone=(remote||[]).map(x=>x.id).filter(id=>!keep.has(id));
  if(gone.length){const {error}=await mnCloud.from('products').delete().in('id',gone);if(error)throw error;}
  document.getElementById('mnCloudBadge').textContent='Nube: guardado ✓';
 }catch(e){console.error(e);document.getElementById('mnCloudBadge').textContent='Nube: error';alert('No se pudo guardar el catálogo en Supabase: '+e.message);}
}
// Conserva V13.1 localmente y, cuando cambia Productos, replica el catálogo a Supabase.
const mnOriginalSetItem=localStorage.setItem.bind(localStorage);
localStorage.setItem=function(k,v){mnOriginalSetItem(k,v);if(k==='mn_products'&&window.mnCloudReady)queueMicrotask(mnSyncProducts);};
async function mnOpenAdmin(){await mnCheckAdmin();document.getElementById('mnAuthGate').style.display='none';window.mnCloudReady=false;await mnLoadCloudProducts();window.mnCloudReady=true;document.getElementById('mnCloudBadge').textContent='Nube: conectada ✓';}
async function mnBoot(){const {data}=await mnCloud.auth.getSession();if(data.session){try{await mnOpenAdmin();}catch(e){await mnCloud.auth.signOut();document.getElementById('mnAuthError').textContent=e.message;}}}
document.getElementById('mnLoginBtn').onclick=async()=>{const b=document.getElementById('mnLoginBtn'),err=document.getElementById('mnAuthError');err.textContent='';b.disabled=true;b.textContent='Entrando…';try{const email=document.getElementById('mnLoginEmail').value.trim(),password=document.getElementById('mnLoginPassword').value;const {error}=await mnCloud.auth.signInWithPassword({email,password});if(error)throw error;await mnOpenAdmin();}catch(e){err.textContent=e.message||'No se pudo iniciar sesión.';}finally{b.disabled=false;b.textContent='Entrar';}};
mnBoot();
</script>
<script>
// V14.1: sincronización completa de datos operativos con Supabase.
const mnStateKeys={faqs:true,config:true,categories:true,sizes:true,forms:true,lengths:true,sales:false};
function mnPayload(x){return JSON.parse(JSON.stringify(x));}
async function mnUpsertCloud(table,row,conflict){const {error}=await mnCloud.from(table).upsert(row,{onConflict:conflict});if(error)throw error;}
async function mnSyncCollection(k){
 if(!window.mnCloudReady)return;
 try{
  if(k==='orders'){
   for(const o of orders) await mnUpsertCloud('mn_orders_cloud',{order_number:o.number,whatsapp:String(o.whatsapp||'').replace(/\D/g,''),payload:mnPayload(o),updated_at:new Date().toISOString()},'order_number');
  }else if(k==='requests'){
   for(const r of requests) await mnUpsertCloud('mn_requests_cloud',{request_number:r.number,whatsapp:String(r.whatsapp||'').replace(/\D/g,''),payload:mnPayload(r),updated_at:new Date().toISOString()},'request_number');
  }else if(k==='discounts'){
   for(const d of discounts) await mnUpsertCloud('mn_discounts_cloud',{code:String(d.code||'').toUpperCase(),payload:mnPayload(d),updated_at:new Date().toISOString()},'code');
  }else if(k in mnStateKeys){
   const value=({faqs,config,categories,sizes,forms,lengths,sales})[k];
   await mnUpsertCloud('mn_store_state',{key:k,payload:mnPayload(value),public_read:!!mnStateKeys[k],updated_at:new Date().toISOString()},'key');
  }
  document.getElementById('mnCloudBadge').textContent='Nube: guardado ✓';
 }catch(e){console.error('Cloud sync '+k,e);document.getElementById('mnCloudBadge').textContent='Nube: error';}
}
const mnSetItemV141=localStorage.setItem.bind(localStorage);
localStorage.setItem=function(k,v){mnSetItemV141(k,v);const short=k.startsWith('mn_')?k.slice(3):k;if(['orders','requests','discounts','faqs','config','categories','sizes','forms','lengths','sales'].includes(short)&&window.mnCloudReady)queueMicrotask(()=>mnSyncCollection(short));};
async function mnLoadFullCloud(){
 // V14.5: cada módulo se carga de forma independiente.
 // Un fallo en solicitudes/descuentos/configuración ya no impide mostrar pedidos válidos.
 const results=await Promise.allSettled([
  mnCloud.from('mn_orders_cloud').select('order_number,payload,created_at').order('created_at',{ascending:false}),
  mnCloud.from('mn_requests_cloud').select('request_number,payload,created_at').order('created_at',{ascending:false}),
  mnCloud.from('mn_discounts_cloud').select('code,payload'),
  mnCloud.from('mn_store_state').select('key,payload')
 ]);
 const [ooS,rrS,ddS,ssS]=results;
 const getResult=(settled,label)=>{
   if(settled.status==='rejected'){console.error('Cloud '+label,settled.reason);return null;}
   const r=settled.value;
   if(r?.error){console.error('Cloud '+label,r.error);return null;}
   return r;
 };
 const oo=getResult(ooS,'orders');
 const rr=getResult(rrS,'requests');
 const dd=getResult(ddS,'discounts');
 const ss=getResult(ssS,'state');

 if(oo){
   orders=(oo.data||[]).map(x=>{
     const raw=(x.payload&&typeof x.payload==='object')?x.payload:{};
     const p={...raw};
     // Compatibilidad entre pedidos antiguos y el formato actual de la tienda.
     p.number=p.number||p.numero||x.order_number;
     p.name=p.name||p.nombre||'';
     p.whatsapp=String(p.whatsapp||p.WhatsApp||'');
     p.items=Array.isArray(p.items)?p.items:(Array.isArray(p.elementos)?p.elementos:(Array.isArray(p.articulos)?p.articulos:[]));
     p.created=p.created||p.creado||p.created_at||x.created_at||new Date().toISOString();
     p.status=p.status||p.estado||'Nuevo';
     p.delivery=p.delivery||p.entrega||'';
     p.address=p.address||p.direccion||'';
     p.total=Number(p.total??p.total_final??0);
     p.subtotal=Number(p.subtotal??p.subtotal_final??p.total??0);
     if(p.hidden==null)p.hidden=!!p.oculto;
     return p;
   });
   mnOriginalSetItem('mn_orders',JSON.stringify(orders));
 }
 if(rr){
   requests=(rr.data||[]).map(x=>{
     const p=(x.payload&&typeof x.payload==='object')?x.payload:{};
     if(!p.number)p.number=x.request_number;
     return p;
   });
   mnOriginalSetItem('mn_requests',JSON.stringify(requests));
 }
 if(dd){
   discounts=(dd.data||[]).map(x=>{
     const p=(x.payload&&typeof x.payload==='object')?x.payload:{};
     if(!p.code)p.code=x.code;
     return p;
   });
   mnOriginalSetItem('mn_discounts',JSON.stringify(discounts));
 }
 if(ss){
   for(const x of ss.data||[]){
     if(x.key==='faqs')faqs=x.payload;
     if(x.key==='config')config=x.payload;
     if(x.key==='categories')categories=x.payload;
     if(x.key==='sizes')sizes=x.payload;
     if(x.key==='forms')forms=x.payload;
     if(x.key==='lengths')lengths=x.payload;
     if(x.key==='sales')sales=x.payload;
     mnOriginalSetItem('mn_'+x.key,JSON.stringify(x.payload));
   }
 }
 renderAdmin();

 const failed=[
   !oo&&'pedidos',!rr&&'solicitudes',!dd&&'descuentos',!ss&&'configuración'
 ].filter(Boolean);
 if(failed.length){
   document.getElementById('mnCloudBadge').textContent='Nube: parcial';
   console.warn('Módulos sin acceso:',failed.join(', '));
 }else{
   document.getElementById('mnCloudBadge').textContent='Nube: conectada ✓';
 }
}
let mnAdminRefreshing=false;
async function mnRefreshAdminCloud(btn){
 if(mnAdminRefreshing)return; mnAdminRefreshing=true;
 const old=btn?.textContent;if(btn){btn.disabled=true;btn.textContent='Actualizando…';}
 try{await mnLoadFullCloud();}
 catch(e){console.error('Actualización de pedidos',e);document.getElementById('mnCloudBadge').textContent='Nube: error';}
 finally{mnAdminRefreshing=false;if(btn){btn.disabled=false;btn.textContent=old||'↻ Actualizar nube';}}
}
window.addEventListener('focus',()=>{if(window.mnCloudReady)mnRefreshAdminCloud();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&window.mnCloudReady)mnRefreshAdminCloud();});
window.addEventListener('pageshow',()=>{if(window.mnCloudReady)mnRefreshAdminCloud();});
const mnOpenAdminV14=mnOpenAdmin;
mnOpenAdmin=async function(){await mnOpenAdminV14();window.mnCloudReady=false;try{await mnLoadFullCloud();}catch(e){console.error(e);console.error('Carga operativa de nube',e);document.getElementById('mnCloudBadge').textContent='Nube: error';}window.mnCloudReady=true;};
</script>
